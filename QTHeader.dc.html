<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@300;400;500&amp;family=Sora:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<script src="data/site.js"></script>
<style>
@keyframes qtDrop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
</style>
</helmet>
<header onMouseLeave="{{ closeMenu }}" style="position:fixed;top:0;left:0;right:0;z-index:60;font-family:'Sora','Noto Sans SC',sans-serif">
  <div style="background:{{ barBg }};border-bottom:1px solid {{ barLine }};transition:background .5s,border-color .5s,backdrop-filter .5s;backdrop-filter:{{ barBlur }};-webkit-backdrop-filter:{{ barBlur }}">
    <div style="max-width:1560px;margin:0 auto;padding:0 clamp(20px,4vw,64px);height:72px;display:flex;align-items:center;justify-content:space-between;gap:32px">
      <a href="{{ homeHref }}" aria-label="Quantum Tech, accueil" style="display:flex;align-items:center;flex:none"><img src="media/brand/lockup.png" alt="量子技术 Quantum Tech" style="height:28px;width:auto;display:block"></a>
      <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
        <nav aria-label="Navigation principale" style="display:flex;gap:2px">
          <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
            <button onMouseEnter="{{ n.open }}" onFocus="{{ n.open }}" onClick="{{ n.toggle }}" aria-expanded="{{ n.expanded }}" style="position:relative;background:none;border:0;cursor:pointer;color:{{ n.color }};font:400 14px 'Sora',sans-serif;letter-spacing:.01em;padding:26px 16px;transition:color .3s">{{ n.label }}<span style="position:absolute;left:16px;right:16px;bottom:18px;height:1px;background:linear-gradient(90deg,#4F7BE0,#D46CA8);transform:scaleX({{ n.bar }});transform-origin:left;transition:transform .45s cubic-bezier(.16,.84,.24,1)"></span></button>
          </sc-for>
        </nav>
      </sc-if>
      <div style="display:flex;gap:18px;align-items:center;flex:none">
        <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;gap:18px;align-items:center;font:400 12px 'Sora',sans-serif">
            <a href="Carrieres.dc.html" style="color:#9A97B4" style-hover="color:#F2F0FA">Carrières</a>
            <a href="Investisseurs.dc.html" style="color:#9A97B4" style-hover="color:#F2F0FA">Investisseurs</a>
            <a href="Contact.dc.html" style="color:#9A97B4" style-hover="color:#F2F0FA">Contact</a>
          </div>
          <span style="width:1px;height:16px;background:#2A2840"></span>
        </sc-if>
        <div style="display:flex;gap:8px">
          <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3"><button onClick="{{ l.select }}" aria-pressed="{{ l.pressed }}" style="background:none;border:0;padding:4px 2px;cursor:pointer;font:500 11px 'JetBrains Mono','Noto Sans SC',monospace;letter-spacing:.06em;color:{{ l.color }};transition:color .3s">{{ l.label }}</button></sc-for>
        </div>
        <button onClick="{{ toggleSearch }}" aria-label="Recherche" aria-expanded="{{ searchOpen }}" style="width:36px;height:36px;border:1px solid #2A2840;border-radius:50%;background:none;cursor:pointer;color:#C9C6DA;display:flex;align-items:center;justify-content:center;transition:border-color .3s" style-hover="border-color:#8B6AD8;color:#FFFFFF"><span style="position:relative;width:10px;height:10px;border:1.5px solid currentColor;border-radius:50%;display:block;margin:-2px 0 0 -2px"><span style="position:absolute;right:-5px;bottom:-4px;width:5px;height:1.5px;background:currentColor;transform:rotate(45deg)"></span></span></button>
        <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleMobile }}" aria-label="Menu" aria-expanded="{{ mobileOpen }}" style="width:36px;height:36px;border:1px solid #2A2840;border-radius:50%;background:none;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center"><span style="width:14px;height:1.5px;background:#F2F0FA;transition:transform .3s;transform:{{ burgerTop }}"></span><span style="width:14px;height:1.5px;background:#F2F0FA;transition:transform .3s;transform:{{ burgerBot }}"></span></button>
        </sc-if>
      </div>
    </div>
  </div>

  <sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
    <div style="background:rgba(8,8,18,.96);backdrop-filter:blur(18px);border-bottom:1px solid #1C1B2E;box-shadow:0 40px 80px rgba(0,0,0,.5);animation:qtDrop .4s cubic-bezier(.16,.84,.24,1)">
      <div style="max-width:1560px;margin:0 auto;padding:28px clamp(20px,4vw,64px) 36px;display:flex;flex-direction:column;gap:20px">
        <div style="display:flex;gap:20px;align-items:center">
          <span style="font:500 11px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#A98BEF">RECHERCHE</span>
          <input autoFocus value="{{ q }}" onInput="{{ onQuery }}" placeholder="Produit, plateforme, communiqué…" style="flex:1;min-width:0;border:0;border-bottom:1px solid #2A2840;background:transparent;font:300 26px 'Sora',sans-serif;padding:10px 0;color:#F2F0FA;outline:none">
          <button onClick="{{ toggleSearch }}" style="background:none;border:1px solid #2A2840;color:#C9C6DA;padding:10px 16px;cursor:pointer;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.12em" style-hover="border-color:#8B6AD8;color:#FFFFFF">FERMER</button>
        </div>
        <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 32px">
            <sc-for list="{{ results }}" as="r"><a href="{{ r.href }}" onClick="{{ closeAll }}" style="display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #15142A;font:400 15px 'Sora',sans-serif;color:#C9C6DA" style-hover="color:#FFFFFF"><span>{{ r.label }}</span><span style="font:400 10px 'JetBrains Mono',monospace;letter-spacing:.08em;color:#6F6C88;padding-top:4px;flex:none">{{ r.meta }}</span></a></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
          <span style="font:400 12px 'JetBrains Mono',monospace;color:#6F6C88">Aucun résultat pour « {{ q }} ».</span>
        </sc-if>
        <sc-if value="{{ showSuggest }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <span style="font:400 11px 'JetBrains Mono',monospace;color:#6F6C88;margin-right:6px">Suggestions</span>
            <sc-for list="{{ suggestions }}" as="s"><button onClick="{{ s.pick }}" style="background:none;border:1px solid #2A2840;border-radius:999px;color:#C9C6DA;padding:6px 14px;cursor:pointer;font:400 13px 'Sora',sans-serif" style-hover="border-color:#8B6AD8;color:#FFFFFF">{{ s.label }}</button></sc-for>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="background:rgba(8,8,18,.96);backdrop-filter:blur(18px);border-bottom:1px solid #1C1B2E;box-shadow:0 40px 80px rgba(0,0,0,.5);animation:qtDrop .4s cubic-bezier(.16,.84,.24,1)">
      <div style="max-width:1560px;margin:0 auto;padding:44px clamp(20px,4vw,64px) 52px;display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:56px">
        <div style="display:flex;gap:24px;border-right:1px solid #1C1B2E;padding-right:40px">
          <div style="writing-mode:vertical-rl;font:300 28px/1 'Noto Sans SC',sans-serif;letter-spacing:.24em;color:#3A3856">{{ menu.zh }}</div>
          <div style="display:flex;flex-direction:column;gap:14px">
            <span style="font:500 11px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#A98BEF">{{ menu.code }} — {{ menu.upper }}</span>
            <p style="margin:0;font:300 20px/1.4 'Sora',sans-serif;color:#F2F0FA;text-wrap:pretty">{{ menu.intro }}</p>
            <a href="{{ menu.href }}" onClick="{{ closeAll }}" style="font:500 12px 'JetBrains Mono',monospace;color:#A98BEF;margin-top:8px" style-hover="color:#FFFFFF">Découvrir →</a>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 32px;align-content:start">
          <sc-for list="{{ menu.cols }}" as="c">
            <div style="display:flex;flex-direction:column">
              <span style="font:500 10px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#6F6C88;padding-bottom:10px;border-bottom:1px solid #1C1B2E">{{ c.title }}</span>
              <sc-for list="{{ c.links }}" as="l"><a href="{{ l.href }}" onClick="{{ closeAll }}" style="display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #15142A;font:400 14px 'Sora',sans-serif;color:#C9C6DA" style-hover="color:#FFFFFF"><span>{{ l.label }}</span><span style="font:400 10px 'JetBrains Mono',monospace;color:#6F6C88;padding-top:3px;flex:none">{{ l.meta }}</span></a></sc-for>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;top:72px;left:0;right:0;bottom:0;background:#05050B;overflow:auto;padding:24px clamp(20px,4vw,64px) 48px;display:flex;flex-direction:column;gap:4px;animation:qtDrop .4s cubic-bezier(.16,.84,.24,1)">
      <sc-for list="{{ mobileLinks }}" as="m"><a href="{{ m.href }}" onClick="{{ closeAll }}" style="display:flex;justify-content:space-between;align-items:baseline;padding:20px 0;border-bottom:1px solid #1C1B2E;font:300 30px 'Sora',sans-serif;color:#F2F0FA"><span>{{ m.label }}</span><span style="font:400 11px 'JetBrains Mono',monospace;color:#6F6C88">{{ m.num }}</span></a></sc-for>
      <div style="display:flex;gap:24px;padding-top:28px;font:400 14px 'Sora',sans-serif">
        <a href="Carrieres.dc.html" style="color:#9A97B4">Carrières</a><a href="Investisseurs.dc.html" style="color:#9A97B4">Investisseurs</a><a href="Contact.dc.html" style="color:#9A97B4">Contact</a>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:480},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;societe&quot;,&quot;divisions&quot;,&quot;plateformes&quot;,&quot;catalogue&quot;,&quot;actualites&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;solid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { menu: null, search: false, q: '', mobileOpen: false, lang: 'fr', scrolled: false, w: 1440, ready: !!window.QT_DATA };
  componentDidMount() {
    const wait = () => { if (window.QT_DATA) this.setState({ ready: true }); else this.t = setTimeout(wait, 40); };
    wait();
    try { const l = localStorage.getItem('qt_lang'); if (l) this.setState({ lang: l }); } catch (e) {}
    this.onScroll = () => { const s = window.scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this.onResize = () => this.setState({ w: window.innerWidth, ...(window.innerWidth >= 1080 ? { mobileOpen: false } : {}) });
    this.onKey = (e) => { if (e.key === 'Escape') this.closeAll(); };
    this.onScroll(); this.onResize();
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() {
    clearTimeout(this.t);
    window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onResize); window.removeEventListener('keydown', this.onKey);
  }
  closeAll = () => this.setState({ menu: null, search: false, mobileOpen: false });
  setLang(id) {
    this.setState({ lang: id });
    try { localStorage.setItem('qt_lang', id); } catch (e) {}
    window.dispatchEvent(new CustomEvent('qt-lang', { detail: id }));
  }
  menus(D) {
    const pad = n => String(n).padStart(2, '0');
    const prods = D.products.filter(p => p.published);
    const soc = { 'Profil': 'profil', 'Histoire': 'histoire', 'Dirigeants': 'dirigeants', 'Gouvernance': 'gouvernance', 'Implantations': 'implantations', 'Éthique & responsabilité': 'ethique' };
    let k = 0;
    return {
      societe: { code: '01', label: 'Société', zh: '公司', intro: D.nav.societe.intro, href: 'Societe.dc.html',
        cols: [{ title: 'LE GROUPE', links: D.nav.societe.links.map((l, i) => ({ label: l, href: soc[l] ? 'Societe.dc.html#' + soc[l] : 'Guardians.dc.html', meta: pad(i + 1) })) }] },
      divisions: { code: '02', label: 'Divisions', zh: '部门', intro: 'Quatre pôles, douze divisions, une même intelligence.', href: 'Divisions.dc.html',
        cols: D.nav.poles.map(p => ({ title: p.code + ' · ' + p.name.toUpperCase(), links: p.divisions.map(d => ({ label: d, href: 'Divisions.dc.html#' + p.code.toLowerCase(), meta: pad(++k) })) })) },
      plateformes: { code: '03', label: 'Plateformes', zh: '平台', intro: D.nav.plateformes[0].line, href: 'COSMOS.dc.html',
        cols: [
          { title: 'EN SERVICE', links: D.intelligence.platforms.filter(p => p.published).map(p => ({ label: p.name, href: 'COSMOS.dc.html', meta: p.status })) },
          { title: 'INTELLIGENCE', links: [{ label: "L'intelligence Quantum", href: 'Intelligence.dc.html', meta: '' }, { label: 'IA embarquée', href: 'Intelligence.dc.html#embarquee', meta: '' }, { label: "Éthique de l'IA", href: 'Intelligence.dc.html#ethique', meta: '' }] }
        ] },
      catalogue: { code: '04', label: 'Catalogue', zh: '产品', intro: 'Trois univers : se déplacer, protéger, vivre au quotidien.', href: 'Catalogue.dc.html',
        cols: D.universes.map(u => ({ title: u.code + ' · ' + u.name.toUpperCase(), links: u.categories.map(c => ({ label: c, href: 'Catalogue.dc.html?u=' + u.id + '&c=' + encodeURIComponent(c), meta: String(prods.filter(p => p.category === c).length) })) })) },
      actualites: { code: '05', label: 'Actualités', zh: '新闻', intro: D.news[0].title, href: 'Actualites.dc.html',
        cols: [
          { title: 'RUBRIQUES', links: [['Communiqués', 'Communiqué'], ['Rapports', 'Rapport'], ['Événements', 'Événement'], ['Médiathèque', 'Médiathèque']].map((l, i) => ({ label: l[0], href: 'Actualites.dc.html?t=' + encodeURIComponent(l[1]), meta: pad(i + 1) })) },
          { title: 'À LA UNE', links: D.news.slice(0, 3).map((n, i) => ({ label: n.title, href: 'Article.dc.html?i=' + i, meta: n.date.replace(/ 20\d\d$/, '') })) }
        ] }
    };
  }
  renderVals() {
    const D = window.QT_DATA;
    if (!D) return {};
    const st = this.state, M = this.menus(D);
    const desktop = st.w >= 1080;
    const active = this.props.active || '';
    const lit = this.props.solid || st.scrolled || st.menu || st.search || st.mobileOpen;
    const q = st.q.trim().toLowerCase();
    const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const nq = norm(q);
    let results = [];
    if (nq.length > 1) {
      D.products.filter(p => p.published && norm([p.name, p.zh, p.type, p.category].join(' ')).includes(nq)).forEach(p => results.push({ label: p.name + (p.zh ? ' ' + p.zh : ''), meta: (p.type || p.category || '').toUpperCase(), href: 'Produit.dc.html?id=' + p.id }));
      if (norm('cosmos plateforme ville ia intelligence').includes(nq) || norm(D.cosmos.full).includes(nq)) results.push({ label: 'COSMOS', meta: 'PLATEFORME', href: 'COSMOS.dc.html' });
      if (norm('guardians gdo programme').includes(nq)) results.push({ label: 'Programme Guardians', meta: "PROGRAMME D'ÉTAT", href: 'Guardians.dc.html' });
      D.news.forEach((n, i) => { if (norm(n.title).includes(nq)) results.push({ label: n.title, meta: n.type.toUpperCase(), href: 'Article.dc.html?i=' + i }); });
      results = results.slice(0, 12);
    }
    const ids = Object.keys(M);
    return {
      homeHref: 'Quantum%20Tech%20-%20Accueil.dc.html',
      desktop, mobile: !desktop,
      barBg: lit ? 'rgba(5,5,11,.82)' : 'rgba(5,5,11,0)',
      barLine: lit ? '#1C1B2E' : 'rgba(28,27,46,0)',
      barBlur: lit ? 'blur(18px) saturate(140%)' : 'none',
      closeMenu: () => this.setState({ menu: null }),
      closeAll: this.closeAll,
      navItems: ids.map(id => {
        const on = st.menu === id || (!st.menu && active === id);
        return { label: M[id].label, expanded: st.menu === id, color: on ? '#FFFFFF' : '#C9C6DA', bar: on ? 1 : 0,
          open: () => this.setState({ menu: id, search: false }), toggle: () => this.setState(s => ({ menu: s.menu === id ? null : id, search: false })) };
      }),
      menuOpen: !!st.menu && desktop,
      menu: st.menu ? { ...M[st.menu], upper: M[st.menu].label.toUpperCase() } : { cols: [] },
      langs: D.languages.map(l => ({ label: l.label, pressed: st.lang === l.id, color: st.lang === l.id ? '#FFFFFF' : '#6F6C88', select: () => this.setLang(l.id) })),
      toggleSearch: () => this.setState(s => ({ search: !s.search, menu: null, mobileOpen: false, q: s.search ? '' : s.q })),
      searchOpen: st.search,
      q: st.q,
      onQuery: (e) => this.setState({ q: e.target.value }),
      results, hasResults: results.length > 0, noResults: nq.length > 1 && !results.length, showSuggest: nq.length < 2,
      suggestions: ['COSMOS', 'Longwei', 'Xiaoban', 'Weihe', 'V-Rail', 'Guardians'].map(s => ({ label: s, pick: () => this.setState({ q: s }) })),
      toggleMobile: () => this.setState(s => ({ mobileOpen: !s.mobileOpen, search: false, menu: null })),
      mobileOpen: st.mobileOpen && !desktop,
      burgerTop: st.mobileOpen ? 'translateY(2.75px) rotate(45deg)' : 'none',
      burgerBot: st.mobileOpen ? 'translateY(-2.75px) rotate(-45deg)' : 'none',
      mobileLinks: ids.map((id, i) => ({ label: M[id].label, href: M[id].href, num: String(i + 1).padStart(2, '0') }))
    };
  }
}
</script>
</body>
</html>
